name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Web assets
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Capacitor (Android project)
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "今月あといくら？" io.github.dicekakumei.atoikura --web-dir www
          npx cap add android

      - name: Icons
        run: cp -r android-res/. android/app/src/main/res/

      - name: Version
        run: |
          VERSION="0.0.0"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle

      - name: Build (unsigned release)
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS --out atoikura.apk aligned.apk
          "$BT/apksigner" verify --print-certs atoikura.apk
          rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: atoikura-apk
          path: atoikura.apk

      - name: Release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" atoikura.apk \
            --title "今月あといくら？ $GITHUB_REF_NAME (Android)" \
            --notes "Android用のAPKです。ダウンロードして開くと、提供元不明のアプリとしてインストールできます（設定の許可が必要）。中身はブラウザ版と同じ1ファイルのアプリです。"
